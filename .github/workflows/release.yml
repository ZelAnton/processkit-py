name: Release

# Manual, multi-platform release to PyPI. Shipped ENABLED but
# `workflow_dispatch`-only (no push/tag trigger), so it never runs on its own —
# click "Run workflow" and pick a bump. The version is never typed by hand: the
# latest `v*` tag drives the next number; the first release (no `v*` tag yet)
# seeds from the `version` in pyproject.toml.
#
# Pipeline:
#   prepare       — compute the version, fill/extract release notes, bump the
#                   manifests (uploaded as the `release-meta` artifact).
#   build_dists   — the shared reusable workflow (_build-dists.yml): the
#                   cibuildwheel matrix (abi3 GIL + free-threaded cp314t wheels)
#                   plus the sdist, built with the bumped manifests overlaid.
#   publish       — the single irreversible PyPI pivot, then push + GitHub Release.
#
# Actions are pinned to a full commit SHA (supply-chain hardening); the trailing
# comment records the human-readable version. Dependabot bumps the SHA + comment.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type (ignored on the first release)'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: 'patch'

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Compute the version and assemble the release metadata. No build, no remote
  # writes — everything here is reversible and re-runnable.
  # ---------------------------------------------------------------------------
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      current: ${{ steps.version.outputs.current }}
      first_release: ${{ steps.version.outputs.first_release }}
    steps:
      - name: Guard — release only from main
        run: |
          set -euo pipefail
          # Read the dispatch ref from $GITHUB_REF (not an interpolated expression) to
          # avoid script injection via a crafted branch name. Standard Actions guard.
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "::error::Release must be dispatched from main (got: $GITHUB_REF). Re-run with 'Use workflow from: main'."
            exit 1
          fi
          echo "Dispatched from main."

      # No publish-credential preflight: with Trusted Publishing the credential is
      # minted per run (no PYPI_API_TOKEN to check), and a missing trusted publisher
      # can't be verified from here — it surfaces at the publish pivot with a clear
      # error + a setup link, before anything reaches the remote or the registry.

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0 # full history + tags, for version math and git-cliff
          persist-credentials: false

      - name: Determine next version
        id: version
        run: |
          set -euo pipefail
          # Newest version-sorted release tag. Use for-each-ref (--count=1) rather than
          # `git tag --list ... | head -n1`: head closes the pipe after one line, which
          # can SIGPIPE-abort `git tag` under `set -o pipefail` once the tag list exceeds
          # the pipe buffer (~thousands of tags).
          LATEST_TAG=$(git for-each-ref --count=1 --sort=-v:refname \
            --format='%(refname:short)' 'refs/tags/v[0-9]*.[0-9]*.[0-9]*')
          if [[ -n "$LATEST_TAG" ]]; then
            CURRENT="${LATEST_TAG#v}"
            if [[ ! "$CURRENT" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Could not parse current version from tag (got: '$CURRENT')"
              exit 1
            fi
            IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
            case "${{ inputs.bump }}" in
              major) NEW="$((MAJOR+1)).0.0" ;;
              minor) NEW="${MAJOR}.$((MINOR+1)).0" ;;
              patch) NEW="${MAJOR}.${MINOR}.$((PATCH+1))" ;;
            esac
            echo "Latest release tag: $LATEST_TAG (current=$CURRENT); ${{ inputs.bump }} bump -> $NEW"
            echo "first_release=false" >> "$GITHUB_OUTPUT"
          else
            # First release: seed the version straight from pyproject.toml so the
            # published version matches what the repo declares. The bump input is ignored.
            CURRENT="0.0.0"
            NEW=$(grep -oP '(?<=^version = ")[^"]+' pyproject.toml | head -n1)
            echo "No release tags found; seeding first release from pyproject version=$NEW (bump input ignored)."
            echo "first_release=true" >> "$GITHUB_OUTPUT"
          fi
          if [[ ! "$NEW" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Computed version '$NEW' is not a valid MAJOR.MINOR.PATCH semver."
            exit 1
          fi
          {
            echo "current=$CURRENT"
            echo "version=$NEW"
            echo "tag=v$NEW"
          } >> "$GITHUB_OUTPUT"

      - name: Verify tag does not exist
        run: |
          if git rev-parse "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::Tag ${{ steps.version.outputs.tag }} already exists"
            exit 1
          fi

      # git-cliff (next step) needs the previous tag locally to bound its commit range.
      # When it is missing (synthetic v0.0.0 of a first release) create it locally and
      # DO NOT push it — pushing would be a remote write before the pivot and would
      # break first-release re-run safety.
      - name: Ensure previous tag exists (local only)
        env:
          PREV_TAG: v${{ steps.version.outputs.current }}
        run: |
          set -euo pipefail
          if git rev-parse "$PREV_TAG" >/dev/null 2>&1; then
            echo "Previous tag $PREV_TAG already exists."
            exit 0
          fi
          ROOT=$(git rev-list --max-parents=0 HEAD | tail -n1)
          echo "Previous tag $PREV_TAG does not exist; creating it locally at root commit $ROOT (not pushed)."
          git tag "$PREV_TAG" "$ROOT"

      - name: Install git-cliff
        uses: taiki-e/install-action@288e746965032cfcc232e09af2daf5f23c14d780 # v2
        with:
          tool: git-cliff@2

      - name: Auto-fill [Unreleased] from git log if empty
        run: |
          set -euo pipefail
          python3 scripts/release/changelog.py autofill --prev-tag "v${{ steps.version.outputs.current }}"

      - name: Extract release notes from CHANGELOG.md
        run: |
          set -euo pipefail
          python3 scripts/release/changelog.py extract-notes --out release-notes.md

      # Persist the computed version into pyproject.toml AND Cargo.toml so the wheels
      # built downstream carry the released version. maturin reads the version from
      # pyproject.toml; Cargo.toml is bumped in parallel to keep both in sync. These
      # reversible edits travel to the build/publish jobs as the `release-meta`
      # artifact and reach the remote only after the pivot.
      - name: Bump version in pyproject.toml and Cargo.toml
        run: |
          set -euo pipefail
          NEW="${{ steps.version.outputs.version }}"
          sed -i -E "s|^version = \"[^\"]+\"|version = \"$NEW\"|" pyproject.toml
          sed -i -E "s|^version = \"[^\"]+\"|version = \"$NEW\"|" Cargo.toml
          # Keep Cargo.lock's entry for the local (path) binding crate in sync.
          # No cargo needed in `prepare`. No source-only-line ambiguity to
          # disambiguate: the binding crate is named `processkit-py`, distinct
          # from the `processkit` registry dependency it wraps.
          python3 scripts/release/cargo_lock.py --new-version "$NEW"

      # uv.lock records its own `version` for this editable package (`source =
      # { editable = "." }`), independent of every other pinned dependency. The
      # version bump above leaves that entry stale, and CI's `uv export --locked`
      # (the pip-audit job) then refuses to run against a lockfile that disagrees
      # with pyproject.toml. Re-lock now so the release commit carries a lockfile
      # consistent with the version it just bumped; no dependency changed, so this
      # only touches that one self-referential field.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Re-lock uv.lock against the bumped version
        run: uv lock

      # The version-bumped manifests + the promoted changelog + the extracted notes,
      # carried to every downstream job as the single source of truth.
      - name: Promote Unreleased section in CHANGELOG.md
        run: |
          set -euo pipefail
          python3 scripts/release/changelog.py promote \
            --version "${{ steps.version.outputs.version }}" \
            --tag "${{ steps.version.outputs.tag }}" \
            --prev-tag "v${{ steps.version.outputs.current }}" \
            --first-release "${{ steps.version.outputs.first_release }}" \
            --repo "${{ github.server_url }}/${{ github.repository }}"

      - name: Regenerate the Pages release notes
        run: |
          python3 scripts/gen_changelog_page.py
          python3 scripts/gen_llms_txt.py

      - name: Upload release metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-meta
          path: |
            pyproject.toml
            Cargo.toml
            Cargo.lock
            uv.lock
            CHANGELOG.md
            docs/changelog.md
            docs/llms.txt
            docs/llms-full.txt
            release-notes.md
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Build the release artifacts (wheels matrix + sdist) via the shared reusable
  # workflow. `overlay-release-meta` overlays the version-bumped manifests from
  # `prepare` so the artifacts carry the release version; the dispatch SHA pins
  # every build to the same source revision. Uploads `wheels-<os>` + `sdist`,
  # consumed by publish.
  # ---------------------------------------------------------------------------
  build_dists:
    needs: prepare
    uses: ./.github/workflows/_build-dists.yml
    with:
      ref: ${{ github.sha }}
      overlay-release-meta: true

  # ---------------------------------------------------------------------------
  # The single irreversible step (PyPI publish) and the reversible writes around
  # it. RELEASE ORDERING INVARIANT: publishing to PyPI cannot be undone (a
  # version can be yanked but never re-uploaded), so it is the pivot. Everything
  # before it is cheap and reversible (the wheels/sdist already built above, plus
  # a LOCAL commit+tag not yet pushed); everything after it (push the commit+tag
  # to main, create the Release) is reversible/recreatable and made idempotent +
  # retried. A failure before the pivot leaves no trace on the remote or
  # registry — just re-run. Never move the publish after the tag push, and keep
  # the post-pivot steps idempotent.
  # ---------------------------------------------------------------------------
  publish:
    needs: [prepare, build_dists]
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the release commit + tag, create the Release
      id-token: write # PyPI Trusted Publishing (OIDC); also enables the token fallback path
    # (Trusted-publishing best practice is a dedicated, minimal `id-token: write`
    # job. It is kept inline here because the pivot ordering — publish, THEN push the
    # tag, THEN create the Release — is the load-bearing invariant; splitting it
    # across jobs to isolate the token scope would risk that ordering for a marginal
    # gain, since the OIDC credential is only usable against this repo's PyPI
    # trusted publisher.)
    steps:
      # No secret preflight: with Trusted Publishing the credential is minted per
      # run (no PYPI_API_TOKEN needed), and the OIDC config can't be checked from
      # here — a missing publisher surfaces at the pivot with a clear error + a
      # setup link, before anything is pushed to the remote.

      # Mint a short-lived GitHub App installation token (the `ZelAnton-release-bot`
      # App, id in `RELEASE_APP_ID`). Pushing the release commit + tag to `main` with it
      # makes the **App** the actor, and the App sits in the branch-protection ruleset's
      # bypass list, so the push is allowed. The default `github-actions[bot]` CANNOT be
      # granted a ruleset bypass (it's a system actor, not an App), and a PAT would
      # expire — an App token is short-lived and auto-revoked. Needs repo variable
      # `RELEASE_APP_ID` + secret `RELEASE_APP_PRIVATE_KEY`; until both are set this step
      # is skipped and the push falls back to `GITHUB_TOKEN` (fine only while `main` is
      # unprotected). See release-token-bypass.md.
      - name: Mint GitHub App token
        id: app-token
        if: ${{ vars.RELEASE_APP_ID != '' }}
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token || secrets.GITHUB_TOKEN }}

      # Overlay the version-bumped manifests + promoted changelog + release notes
      # (the same files the wheels were built from) onto the checkout, so the
      # release commit records exactly what was published.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-meta
          path: .

      - name: Collect built distributions
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: ./artifacts
          pattern: "{wheels-*,sdist}"
          merge-multiple: true

      # Write SHA256SUMS to the workspace root, NOT into ./artifacts: the publish
      # action below uploads every file in its packages-dir, and a non-distribution
      # file there would make twine reject the batch. It is a GitHub Release asset
      # only, never a PyPI upload.
      - name: Generate SHA256SUMS
        run: |
          set -euo pipefail
          shopt -s nullglob
          cd ./artifacts
          files=(*.whl *.tar.gz)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No package files to hash in ./artifacts. Did the build jobs run?"
            exit 1
          fi
          sha256sum "${files[@]}" > ../SHA256SUMS
          cat ../SHA256SUMS

      # Create the release commit and tag LOCALLY, but do NOT push yet: the push is a
      # VCS write and must happen AFTER the irreversible PyPI publish (the pivot below).
      - name: Commit and tag the release (local only)
        run: |
          set -euo pipefail
          git config user.name "Anton Zhelezniakou"
          git config user.email "github@zelanton.net"
          git add pyproject.toml CHANGELOG.md docs/changelog.md docs/llms.txt docs/llms-full.txt Cargo.toml
          # uv.lock and Cargo.lock record resolved deps; re-stage only if already tracked.
          if git ls-files --error-unmatch uv.lock >/dev/null 2>&1; then git add uv.lock; fi
          if git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then git add Cargo.lock; fi
          git commit -m "Release ${{ needs.prepare.outputs.tag }}"
          git tag "${{ needs.prepare.outputs.tag }}"

      # uv is not preinstalled on the GitHub runner image; install it so the
      # `uvx twine check` below resolves. (The publish action does its own
      # metadata check, but this strict pre-pivot gate catches a render/metadata
      # break BEFORE the irreversible step — free here, un-yankable once on PyPI.)
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Check distribution metadata
        run: uvx 'twine>=6,<7' check --strict ./artifacts/*.whl ./artifacts/*.tar.gz

      # A retry may find only part of this version on PyPI. Verify one snapshot,
      # then copy only the absent expected distributions into a dedicated upload
      # directory. The publish step does not tolerate duplicates, so a filename
      # created after this snapshot fails before any VCS write.
      - name: Prepare verified PyPI upload set
        id: pypi-retry
        env:
          EXPECTED_PROJECT: processkit-py
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_WORKFLOW: release.yml
          PYPI_CHECK_PHASE: preflight
          PYPI_BASE_URL: https://pypi.org
        run: |
          cat > "$RUNNER_TEMP/processkit-py-verify-release.py" <<'PY'
          import base64
          import binascii
          import hashlib
          import json
          import os
          import re
          import shutil
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          MAX_RESPONSE_BYTES = 2 * 1024 * 1024
          POST_UPLOAD_ATTEMPTS = 6
          POST_UPLOAD_BACKOFF_SECONDS = 10
          PUBLISH_PREDICATE = "https://docs.pypi.org/attestations/publish/v1"
          SOURCE_CLAIM_OIDS = {
              bytes.fromhex("2b0601040183bf30010c"): "repository",
              bytes.fromhex("2b0601040183bf30010d"): "sha",
              bytes.fromhex("2b0601040183bf30010e"): "ref",
              bytes.fromhex("2b0601040183bf300112"): "workflow",
          }

          project = os.environ["EXPECTED_PROJECT"]
          repository = os.environ["EXPECTED_REPOSITORY"]
          source_sha = os.environ["EXPECTED_SOURCE_SHA"]
          version = os.environ["EXPECTED_VERSION"]
          workflow = os.environ["EXPECTED_WORKFLOW"]
          phase = os.environ["PYPI_CHECK_PHASE"]
          base_url = os.environ["PYPI_BASE_URL"].rstrip("/")

          class PendingPyPISnapshot(Exception):
              pass

          def fail(message):
              raise SystemExit(f"::error::{message}")

          if re.fullmatch(r"[0-9a-f]{40}", source_sha) is None:
              fail(f"Expected source SHA is invalid: {source_sha!r}")

          def sha256(path):
              digest = hashlib.sha256()
              with path.open("rb") as stream:
                  for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                      digest.update(chunk)
              return digest.hexdigest()

          artifact_paths = sorted(
              (*Path("artifacts").glob("*.whl"), *Path("artifacts").glob("*.tar.gz")),
              key=lambda path: path.name,
          )
          if not artifact_paths:
              fail("No local distributions found for the PyPI retry check")
          expected = {path.name: sha256(path) for path in artifact_paths}
          if len(expected) != len(artifact_paths):
              fail("Duplicate local distribution filenames make the artifact set ambiguous")

          def get_json(url, *, missing_ok=False, retryable=False):
              request = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "processkit-py-release-retry-check/1",
                  },
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = response.read(MAX_RESPONSE_BYTES + 1)
              except urllib.error.HTTPError as error:
                  if missing_ok and error.code == 404:
                      return None
                  if retryable and (error.code == 429 or 500 <= error.code < 600):
                      raise PendingPyPISnapshot(
                          f"PyPI returned transient HTTP {error.code}"
                      ) from error
                  fail(f"PyPI returned HTTP {error.code} for retry identity data")
              except (OSError, urllib.error.URLError) as error:
                  if retryable:
                      raise PendingPyPISnapshot(
                          f"Could not read PyPI retry identity data: {error}"
                      ) from error
                  fail(f"Could not read PyPI retry identity data: {error}")
              if len(body) > MAX_RESPONSE_BYTES:
                  if retryable:
                      raise PendingPyPISnapshot(
                          "PyPI retry identity response exceeded the size limit"
                      )
                  fail("PyPI retry identity response exceeded the size limit")
              try:
                  return json.loads(body)
              except (UnicodeDecodeError, json.JSONDecodeError) as error:
                  if retryable:
                      raise PendingPyPISnapshot(
                          f"PyPI retry identity response was not valid JSON: {error}"
                      ) from error
                  fail(f"PyPI retry identity response was not valid JSON: {error}")

          def read_der_tlv(data, offset):
              if offset + 2 > len(data):
                  fail("Existing PyPI provenance certificate is truncated")
              tag = data[offset]
              first_length = data[offset + 1]
              offset += 2
              if first_length & 0x80:
                  length_bytes = first_length & 0x7F
                  if length_bytes == 0 or length_bytes > 4 or offset + length_bytes > len(data):
                      fail("Existing PyPI provenance certificate has invalid DER length")
                  if data[offset] == 0:
                      fail("Existing PyPI provenance certificate has non-canonical DER length")
                  length = int.from_bytes(data[offset : offset + length_bytes], "big")
                  offset += length_bytes
                  if length < 0x80:
                      fail("Existing PyPI provenance certificate has non-canonical DER length")
              else:
                  length = first_length
              end = offset + length
              if end > len(data):
                  fail("Existing PyPI provenance certificate is truncated")
              return tag, data[offset:end], end

          def unwrap_der(data, expected_tag):
              tag, value, end = read_der_tlv(data, 0)
              if tag != expected_tag or end != len(data):
                  fail("Existing PyPI provenance certificate has an unexpected DER structure")
              return value

          def certificate_source_claims(encoded_certificate):
              try:
                  certificate = base64.b64decode(encoded_certificate, validate=True)
              except (TypeError, ValueError, binascii.Error):
                  fail("Existing PyPI provenance certificate is not valid base64")
              certificate_body = unwrap_der(certificate, 0x30)
              tag, tbs_certificate, _ = read_der_tlv(certificate_body, 0)
              if tag != 0x30:
                  fail("Existing PyPI provenance certificate has no TBSCertificate")
              extension_blocks = []
              offset = 0
              while offset < len(tbs_certificate):
                  tag, value, offset = read_der_tlv(tbs_certificate, offset)
                  if tag == 0xA3:
                      extension_blocks.append(value)
              if len(extension_blocks) != 1:
                  fail("Existing PyPI provenance certificate has ambiguous extensions")
              extensions = unwrap_der(extension_blocks[0], 0x30)
              claims = {}
              offset = 0
              while offset < len(extensions):
                  tag, extension, offset = read_der_tlv(extensions, offset)
                  if tag != 0x30:
                      fail("Existing PyPI provenance certificate has an invalid extension")
                  ext_offset = 0
                  tag, oid, ext_offset = read_der_tlv(extension, ext_offset)
                  if tag != 0x06:
                      fail("Existing PyPI provenance certificate extension has no OID")
                  tag, value, next_offset = read_der_tlv(extension, ext_offset)
                  if tag == 0x01:
                      tag, value, next_offset = read_der_tlv(extension, next_offset)
                  if tag != 0x04 or next_offset != len(extension):
                      fail("Existing PyPI provenance certificate extension has no value")
                  claim_name = SOURCE_CLAIM_OIDS.get(oid)
                  if claim_name is None:
                      continue
                  if claim_name in claims:
                      fail(f"Existing PyPI provenance has duplicate {claim_name} claims")
                  claim = unwrap_der(value, 0x0C)
                  try:
                      claims[claim_name] = claim.decode("utf-8")
                  except UnicodeDecodeError:
                      fail(f"Existing PyPI provenance {claim_name} claim is not UTF-8")
              return claims

          def verify_provenance(filename, digest, *, retryable=False):
              quoted = "/".join(
                  urllib.parse.quote(part, safe="")
                  for part in (project, version, filename)
              )
              provenance = get_json(
                  f"{base_url}/integrity/{quoted}/provenance",
                  missing_ok=retryable,
                  retryable=retryable,
              )
              if provenance is None:
                  raise PendingPyPISnapshot(
                      f"PyPI provenance for {filename} is not visible yet"
                  )
              if not isinstance(provenance, dict) or provenance.get("version") != 1:
                  fail(f"Existing PyPI file {filename} has missing or unsupported provenance")
              bundles = provenance.get("attestation_bundles")
              if retryable and bundles == []:
                  raise PendingPyPISnapshot(
                      f"PyPI provenance for {filename} has no attestation bundle yet"
                  )
              if not isinstance(bundles, list) or len(bundles) != 1:
                  fail(f"Existing PyPI file {filename} has ambiguous provenance bundles")
              bundle = bundles[0]
              publisher = bundle.get("publisher") if isinstance(bundle, dict) else None
              expected_publisher = {
                  "environment": None,
                  "kind": "GitHub",
                  "repository": repository,
                  "workflow": workflow,
              }
              if publisher != expected_publisher:
                  fail(f"Existing PyPI file {filename} has unexpected publisher identity")
              attestations = bundle.get("attestations")
              if retryable and attestations == []:
                  raise PendingPyPISnapshot(
                      f"PyPI provenance for {filename} has no attestation yet"
                  )
              if not isinstance(attestations, list) or len(attestations) != 1:
                  fail(f"Existing PyPI file {filename} has ambiguous attestations")
              attestation = attestations[0]
              if not isinstance(attestation, dict) or attestation.get("version") != 1:
                  fail(f"Existing PyPI file {filename} has unsupported attestation data")
              envelope = attestation.get("envelope")
              statement_text = envelope.get("statement") if isinstance(envelope, dict) else None
              try:
                  statement = json.loads(base64.b64decode(statement_text, validate=True))
              except (TypeError, ValueError, binascii.Error, UnicodeDecodeError, json.JSONDecodeError):
                  fail(f"Existing PyPI file {filename} has an invalid attestation statement")
              expected_subject = [{"name": filename, "digest": {"sha256": digest}}]
              if (
                  not isinstance(statement, dict)
                  or statement.get("_type") != "https://in-toto.io/Statement/v1"
                  or statement.get("subject") != expected_subject
                  or statement.get("predicateType") != PUBLISH_PREDICATE
                  or statement.get("predicate") is not None
              ):
                  fail(f"Existing PyPI file {filename} attestation does not match its digest")
              material = attestation.get("verification_material")
              certificate = material.get("certificate") if isinstance(material, dict) else None
              claims = certificate_source_claims(certificate)
              expected_claims = {
                  "repository": f"https://github.com/{repository}",
                  "sha": source_sha,
                  "ref": "refs/heads/main",
                  "workflow": (
                      f"https://github.com/{repository}/.github/workflows/"
                      f"{workflow}@refs/heads/main"
                  ),
              }
              if claims != expected_claims:
                  fail(f"Existing PyPI file {filename} provenance does not match source SHA")

          release_path = "/".join(
              urllib.parse.quote(part, safe="") for part in (project, version)
          )
          release_url = f"{base_url}/pypi/{release_path}/json"

          def verify_release(release, *, require_complete, retryable):
              if not isinstance(release, dict) or release.get("info", {}).get("version") != version:
                  fail("PyPI returned ambiguous release metadata for the target version")
              urls = release.get("urls")
              if not isinstance(urls, list) or not urls:
                  if retryable:
                      raise PendingPyPISnapshot(
                          "PyPI target version has no visible file set yet"
                      )
                  fail("PyPI target version exists without an unambiguous file set")
              seen = set()
              for remote_file in urls:
                  filename = remote_file.get("filename") if isinstance(remote_file, dict) else None
                  digest = remote_file.get("digests", {}).get("sha256") if isinstance(remote_file, dict) else None
                  if not isinstance(filename, str) or filename in seen:
                      fail("PyPI target version contains missing or duplicate filenames")
                  seen.add(filename)
                  if filename not in expected:
                      fail(f"Existing PyPI file {filename} is not in the expected artifact set")
                  if not isinstance(digest, str) or not re.fullmatch(r"[0-9a-f]{64}", digest):
                      fail(f"Existing PyPI file {filename} has no valid SHA-256 digest")
                  if digest != expected[filename]:
                      fail(f"Existing PyPI file {filename} does not match the local SHA-256 digest")
                  if remote_file.get("yanked") is not False:
                      fail(f"Existing PyPI file {filename} is yanked or has ambiguous state")
                  verify_provenance(filename, digest, retryable=retryable)
              if require_complete:
                  missing = sorted(set(expected) - seen)
                  if missing:
                      raise PendingPyPISnapshot(
                          f"PyPI is still missing {len(missing)} expected file(s)"
                      )
              return seen

          def prepare_upload_set():
              release = get_json(release_url, missing_ok=True)
              if release is None:
                  seen = set()
                  print(
                      f"PyPI has no {project} {version}; clean publish will upload all files."
                  )
              else:
                  seen = verify_release(
                      release,
                      require_complete=False,
                      retryable=False,
                  )
              missing = sorted(set(expected) - seen)
              upload_dir = Path("pypi-upload")
              if upload_dir.exists():
                  if upload_dir.is_symlink() or not upload_dir.is_dir():
                      fail("PyPI upload path exists and is not a regular directory")
                  shutil.rmtree(upload_dir)
              upload_dir.mkdir()
              paths_by_name = {path.name: path for path in artifact_paths}
              for filename in missing:
                  target = upload_dir / filename
                  shutil.copyfile(paths_by_name[filename], target)
                  if sha256(target) != expected[filename]:
                      fail(f"Prepared PyPI upload file {filename} changed during copy")
              upload_entries = list(upload_dir.iterdir())
              if (
                  {path.name for path in upload_entries} != set(missing)
                  or any(not path.is_file() or path.is_symlink() for path in upload_entries)
              ):
                  fail("Prepared PyPI upload directory has an unexpected file set")
              has_uploads = "true" if missing else "false"
              with Path(os.environ["GITHUB_OUTPUT"]).open("a", encoding="utf-8") as output:
                  output.write(f"has_uploads={has_uploads}\n")
              print(
                  f"Verified {len(seen)} existing PyPI file(s); prepared "
                  f"{len(missing)} absent file(s) from source {source_sha}."
              )

          def verify_complete_release():
              for attempt in range(1, POST_UPLOAD_ATTEMPTS + 1):
                  try:
                      release = get_json(
                          release_url,
                          missing_ok=True,
                          retryable=True,
                      )
                      if release is None:
                          raise PendingPyPISnapshot(
                              f"PyPI has not exposed {project} {version} yet"
                          )
                      seen = verify_release(
                          release,
                          require_complete=True,
                          retryable=True,
                      )
                  except PendingPyPISnapshot as error:
                      if attempt == POST_UPLOAD_ATTEMPTS:
                          fail(
                              "PyPI did not expose the complete verified release after "
                              f"{POST_UPLOAD_ATTEMPTS} attempts: {error}"
                          )
                      print(
                          f"::warning::PyPI verification attempt {attempt}/"
                          f"{POST_UPLOAD_ATTEMPTS} is not complete: {error}"
                      )
                      time.sleep(POST_UPLOAD_BACKOFF_SECONDS)
                      continue
                  print(
                      f"Verified all {len(seen)} PyPI file(s) against source "
                      f"{source_sha} after upload."
                  )
                  return

          if phase == "preflight":
              prepare_upload_set()
          elif phase == "postflight":
              verify_complete_release()
          else:
              fail(f"Unsupported PyPI verification phase: {phase!r}")
          PY
          python3 "$RUNNER_TEMP/processkit-py-verify-release.py"

      # Fetch the branch tip directly instead of trusting the checkout's stale
      # remote-tracking ref. A concurrent main update invalidates this run before
      # it can cross the irreversible PyPI pivot.
      - name: Guard — main has not moved since dispatch
        env:
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/main
          CURRENT_MAIN_SHA=$(git rev-parse --verify 'FETCH_HEAD^{commit}')
          if [[ "$CURRENT_MAIN_SHA" != "$EXPECTED_SOURCE_SHA" ]]; then
            echo "::error::origin/main moved from dispatch SHA $EXPECTED_SOURCE_SHA to $CURRENT_MAIN_SHA while release artifacts were building. This run stopped before its PyPI publish and before pushing the release commit/tag. Dispatch a new release run from the current main."
            exit 1
          fi
          echo "Fresh origin/main matches dispatch SHA $EXPECTED_SOURCE_SHA."

      # === PIVOT: the single irreversible step ===
      # PyPI Trusted Publishing (OIDC) by default: with NO PYPI_API_TOKEN secret set,
      # the action mints a short-lived credential per run (needs the `id-token: write`
      # permission above + a trusted publisher configured on pypi.org for this
      # repo + this workflow filename — https://docs.pypi.org/trusted-publishers/).
      # If PYPI_API_TOKEN *is* set, the action uses that token instead (a clean
      # fallback for a first release before the publisher is configured). The action
      # receives only files absent from the verified snapshot and never skips a
      # duplicate, closing the preflight/upload race. Under OIDC it attaches PEP 740
      # attestations automatically.
      - name: Publish to PyPI (irreversible pivot)
        if: steps.pypi-retry.outputs.has_uploads == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: pypi-upload
          skip-existing: false
          password: ${{ secrets.PYPI_API_TOKEN }}

      # PyPI's JSON/provenance views may lag a successful upload. Before allowing
      # the atomic VCS push, boundedly re-fetch until the complete expected set is
      # visible with matching filenames, digests, publisher, and dispatch SHA.
      - name: Verify complete PyPI release after upload
        env:
          EXPECTED_PROJECT: processkit-py
          EXPECTED_REPOSITORY: ${{ github.repository }}
          EXPECTED_SOURCE_SHA: ${{ github.sha }}
          EXPECTED_VERSION: ${{ needs.prepare.outputs.version }}
          EXPECTED_WORKFLOW: release.yml
          PYPI_CHECK_PHASE: postflight
          PYPI_BASE_URL: https://pypi.org
        run: python3 "$RUNNER_TEMP/processkit-py-verify-release.py"

      # Reversible VCS write, AFTER the pivot. --atomic guarantees the branch and tag
      # move together (or neither does), so we never advance main while losing the tag.
      - name: Push the release commit + tag (atomic)
        run: git push --atomic origin HEAD:refs/heads/main "${{ needs.prepare.outputs.tag }}"

      # Final, recreatable step, made idempotent (edit the Release if it already
      # exists, else create it) and retried. By now the package is on PyPI AND the tag
      # is on main, so a blind re-run of the WHOLE workflow would compute the NEXT
      # version and orphan this release — hence the failure message tells the operator
      # to finish by hand rather than re-running.
      - name: Create or update the GitHub Release (idempotent)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          assets=(./artifacts/*.whl ./artifacts/*.tar.gz SHA256SUMS)
          for attempt in 1 2 3; do
            if gh release view "$TAG" >/dev/null 2>&1; then
              if gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md \
                 && gh release upload "$TAG" "${assets[@]}" --clobber; then
                echo "Updated existing Release $TAG (attempt $attempt)."
                exit 0
              fi
            else
              if gh release create "$TAG" --title "$TAG" --notes-file release-notes.md "${assets[@]}"; then
                echo "Created Release $TAG (attempt $attempt)."
                exit 0
              fi
            fi
            echo "::warning::GitHub Release step attempt $attempt failed; retrying after backoff..."
            sleep $((attempt * 10))
          done
          echo "::error::Failed to create/update the GitHub Release after 3 attempts. The package is ALREADY on PyPI and the tag is ALREADY on main. Do NOT re-run this workflow (a re-run computes the NEXT version and orphans this release). Finish by hand: if the Release does not exist yet, 'gh release create $TAG --title $TAG --notes-file release-notes.md ./artifacts/*.whl ./artifacts/*.tar.gz SHA256SUMS'; if it already exists, 'gh release edit $TAG --notes-file release-notes.md && gh release upload $TAG ./artifacts/*.whl ./artifacts/*.tar.gz SHA256SUMS --clobber'."
          exit 1

      # Documentation publication is owned by docs.yml. The release commit's
      # push to main triggers that workflow, which builds and deploys mdBook to
      # GitHub Pages; do not duplicate the Pages deployment in this release
      # workflow. See RELEASING.md's "Docs site" note.
