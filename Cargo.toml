[package]
name = "processkit-py"
version = "1.4.2"
edition = "2021"
description = "PyO3 binding crate for the processkit Python package (compiled into wheels)"
license = "MIT"
repository = "https://github.com/ZelAnton/processkit-py"
# This crate is the PyO3 glue compiled into the Python wheels — it is NOT a
# crates.io artifact. The published Rust crate is `processkit` itself (which we
# depend on). Named `processkit-py` (not `processkit`) so the two never share a
# package name in Cargo.lock — the disambiguation the release workflow's
# Cargo.lock-sync step previously needed (a negative-lookahead regex matching
# the local, sourceless entry among two same-named ones) is now structural: an
# ordinary name match is unambiguous.
publish = false

[lib]
# The compiled extension is imported as `processkit._processkit` from Python.
name = "_processkit"
crate-type = ["cdylib"]

# `extension-module` is declared as an optional Cargo feature so that `cargo test`
# and `cargo check` work without it (the feature makes the crate non-linkable as a
# regular dylib, which breaks unit tests that link against the extension).
# maturin activates it when building for Python via [tool.maturin] features in pyproject.toml.
[features]
extension-module = ["pyo3/extension-module"]

[dependencies]
# abi3-py310: build once, run on CPython 3.10+ (3.9 is EOL; matches requires-python in pyproject.toml).
pyo3 = { version = "0.29", features = ["abi3-py310"] }
# Async bridge (tokio ↔ asyncio). The `tokio-runtime` feature gives a managed
# runtime we reuse for BOTH the sync surface (`block_on`) and the async surface
# (`future_into_py`), so the binding owns exactly one runtime. Tracks pyo3 0.29.
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
# The Rust core. Compatible-version requirement `3` (>=3.0.0, <4.0.0) — the
# binding tracks API/behaviour churn deliberately, not transitively, so the
# requirement names the major it was migrated to and nothing narrower: no patch
# pin, no floor-pinned minor. Cargo.lock resolves the exact version actually
# built and is the ONLY place a precise version lives — deliberately not
# repeated here, where it would silently go stale on the next `cargo update`.
#
# History that still shapes this line: 1.3.0 (a semver-broken minor) and 2.0.0
# (a mistaken publish) were yanked upstream, which is why the pre-3.0
# requirement carried a `2.3` floor rather than a bare `2`. Neither yank is
# reachable from a `3` requirement, so the range needs no floor above the major
# any more. 3.0.0 is a deliberate, hand-migrated major (`Error` became a thin
# wrapper over `ErrorReason`; the merged output stream became a process
# lifecycle stream: `output_events()`/`OutputEvent`/`OutputEvents` →
# `events()`/`ProcessEvent`/`ProcessEvents`); see CHANGELOG.md for the
# per-version detail. Each upstream release's new public surface keeps being
# adopted here as it lands, so treat a bump as a deliberate review step — diff
# the crate's shipped `public-api.txt` between the old and new versions in the
# registry cache before believing the release notes (CONTRIBUTING.md,
# "Upgrading the `processkit` core") — rather than a transitive pickup.
#
# Features are listed EXPLICITLY with `default-features = false`, so a change to
# the crate's default set can never silently alter our public surface:
#   - process-control — `ProcessGroup.signal/suspend/resume/members` (the crate's
#     own default; pure code, no extra deps). Listed so it stays on regardless.
#   - limits — `ResourceLimits` (`max_memory`/`max_processes`/`cpu_quota`); implies
#     `stats` (`ProcessGroupStats`, `RunningProcess.cpu_time`/`peak_memory_bytes`,
#     `profile()` / `RunProfile`).
#   - record — the `RecordReplayRunner` cassette double (pulls serde/serde_json).
#   - json — `RunningProcess::stdout_json_lines`/`JsonLines<T>` (T-216): typed
#     NDJSON streaming with line/column/byte-offset decode diagnostics. Pulls
#     `serde`/`serde_json` too, but `record` above already pulls the identical
#     pair — this adds no new external dependency, only unlocks the crate's own
#     `#[cfg(feature = "json")]` surface.
#   - tracing — lets the crate emit a per-run tracing event, which the opt-in
#     `enable_logging()` bridges to Python's `logging` (see src/logging.rs).
# Deliberately NOT enabled: `mock` — a Rust-only `mockall` `MockRunner` for Rust
# tests; it has no Python value (the Python test doubles come from the crate's
# always-on `doubles` surface — ScriptedRunner / RecordingRunner — plus the
# `record`-gated cassette RecordReplayRunner enabled above); `metrics` (3.0.0) —
# a Rust-side `metrics` crate exporter with no Python consumer.
processkit = { version = "3", default-features = false, features = [
  "process-control",
  "limits",
  "pty",
  "record",
  "json",
  "tracing",
] }
# `rt-multi-thread` for the managed runtime; `time`/`sync` are used directly by
# the binding (`tokio::time::timeout` in runtime.rs, `tokio::sync::Mutex` in
# running.rs); `fs` backs the `stdout_tee`/`stderr_tee` file sinks
# (`tokio::fs::File::from_std` in convert.rs — writes dispatched to the runtime's
# blocking pool). Declared explicitly so they don't ride silently on whatever
# `pyo3-async-runtimes` happens to enable.
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "fs"] }
# Bridge the crate's `tracing` events to Python `logging` via the opt-in
# `enable_logging()` (src/logging.rs). `registry` is the only `tracing-subscriber`
# piece we need (a `Layer` over its span store); the heavy fmt/env-filter/ansi
# default features stay off to keep wheels lean.
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry", "std"] }
# Backs `RunningProcess.stdout_json_lines()` (T-216): the crate's typed NDJSON
# decode (`processkit`'s own `json` feature above) hands back a
# `serde_json::value::RawValue` per line — the exact original JSON text, not a
# parsed tree — so this binding can feed it straight to Python's own `json.loads`
# for the actual object construction, matching `run_json`/`arun_json`'s decision
# (see `cli.rs::parse_json`) to lean on stdlib `json` rather than write a
# `serde_json::Value` -> Python-object bridge here (which would also need
# `preserve_order` to keep dict key order, another feature this avoids).
# `raw_value` is the only extra feature needed; already in the tree transitively
# (via `processkit`'s `record`/`json` features), declared directly because this
# crate names `serde_json::value::RawValue` itself.
serde_json = { version = "1", features = ["raw_value"] }

# Unix only: `convert.rs::parse_signal` validates a raw signal number against the
# platform's deliverable range (`1..=SIGRTMAX` on Linux/Android via the runtime
# `SIGRTMAX()`; `1..=SIGUSR2` on macOS/BSD, which have no real-time signals in the
# binding). Already in the tree transitively (via `processkit`/`tokio`); declared
# directly and platform-gated so it never rides into Windows builds, which take
# the `#[cfg(not(unix))]` "raw numbers are Unsupported" path instead.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
lto = true
codegen-units = 1
# Strip debuginfo/symbols from release wheels (smaller artifacts); deliberately
# NOT `panic = "abort"` — PyO3 needs unwinding to convert a Rust panic into a
# Python exception instead of aborting the whole interpreter.
strip = "symbols"
