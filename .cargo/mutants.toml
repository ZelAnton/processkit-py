# The binding crate contains Rust orchestration code in addition to PyO3 declarations.
# Keep mutation testing on all top-level binding modules.
# The weekly workflow divides this complete list into shards to limit each job's duration.
examine_globs = ["src/*.rs"]

# A mutated completion or teardown path can hang instead of failing. Allow a
# slow baseline some headroom while retaining a finite per-mutant deadline.
timeout_multiplier = 6
minimum_test_timeout = 30
