[files]
extend-exclude = [
    # Generated from source docstrings and Markdown.
    "docs/api-reference.md",
    "docs/llms*.txt",
    "docs/changelog.md",  # Generated from CHANGELOG.md; tool names like delocate-wheel
    # Owned by concurrent tasks; remove these entries after those tasks land.
    "src/running.rs",
    "src/processkit/_processkit.pyi",
    "tests/test_readiness.py",
    "tests/test_streaming.py",
    "docs/streaming.md",
    "docs/process-groups.md",
    "docs/troubleshooting.md",
    "docs/cookbook.md",
]

[default]
locale = "en"

[default.extend-words]
abi3 = "abi3"
cgroup = "cgroup"
ConPTY = "ConPTY"
delocate = "delocate"
# Regex fragment in cliff.toml's case-insensitive release matcher.
elease = "elease"
manylinux = "manylinux"
maturin = "maturin"
miswired = "miswired"  # T-223: fixed typo from mis-wired
musllinux = "musllinux"
mypy = "mypy"
PyO3 = "PyO3"
pytest = "pytest"
pyright = "pyright"
rustup = "rustup"
uvloop = "uvloop"
